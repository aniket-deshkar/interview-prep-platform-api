name: interview-prep

services:
  api:
    build: .
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && uvicorn interview_prep.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports: ["8000:8000"]
    volumes: ["./src:/app/src"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: .
    env_file: .env
    command: ["celery", "-A", "interview_prep.worker.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  scheduler:
    build: .
    env_file: .env
    command: ["celery", "-A", "interview_prep.worker.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      redis: { condition: service_healthy }

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: interview_prep
      POSTGRES_USER: interview_prep
      POSTGRES_PASSWORD: interview_prep
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_prep -d interview_prep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb --ignore-existing local/resumes;
        mc anonymous set none local/resumes

volumes:
  postgres-data:
  redis-data:
  minio-data:

