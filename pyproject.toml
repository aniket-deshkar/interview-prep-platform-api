[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "interview-prep-platform-api"
version = "0.1.0"
description = "Production-grade backend for a resume-aware interview preparation platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aniket Deshkar" }]
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "cryptography>=44,<46",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=1.75,<2",
  "orjson>=3.10,<4",
  "pgvector>=0.3,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.4,<7",
  "python-docx>=1.1,<2",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.37,<3",
  "structlog>=25.1,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/interview_prep"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=interview_prep --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/*.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
packages = ["interview_prep"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "celery.*", "docx.*", "pypdf.*"]
ignore_missing_imports = true
